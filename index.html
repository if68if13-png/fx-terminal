<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>日本株スクリーナー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e8e8e8;font-family:'Noto Sans JP',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const CONDITIONS_LIST = [
  { id:"nearLow",     icon:"📉", label:"5年安値近辺" },
  { id:"highDiv",     icon:"💰", label:"高配当（3%以上）" },
  { id:"lowPbr",      icon:"💎", label:"低PBR（1倍以下）" },
  { id:"growthStock", icon:"🚀", label:"成長株" },
  { id:"smallCap",    icon:"🔍", label:"小型株" },
  { id:"fundHeld",    icon:"🏦", label:"大手ファンド保有" },
  { id:"nisa",        icon:"🌱", label:"NISA対応" },
  { id:"lowPrice",    icon:"🪙", label:"1株1000円以下" },
];

const SECTORS = ["全業種","テクノロジー","金融","製造業","ヘルスケア","不動産","消費財","エネルギー","通信","素材"];

const SYSTEM_PROMPT = `あなたは日本株の専門アナリストです。
以下の条件で日本株を5〜8銘柄スクリーニングし、必ずJSON形式のみで返答してください。マークダウンや説明文は一切不要です。

スクリーニング条件: {CONDITIONS}

以下のJSON配列を返してください:
[{"code":"証券コード","name":"銘柄名","sector":"業種","price":株価数値,"minInvestment":最低投資額数値,"per":PER数値,"pbr":PBR数値,"dividendYield":配当利回り数値,"marketCap":"時価総額","reason":"選定理由100文字以内","tags":["タグ"],"signal":"BUY or WATCH or HOLD","fundOverlap":[],"nearLow":true/false,"lowRatio":乖離率数値,"low5yPrice":5年最安値数値,"undervalued":true/false,"priceChange1M":1ヶ月騰落率数値,"nisaGrowth":true/false}]

2025〜2026年の実際の日本株市場を反映した現実的なデータを使用してください。
「1株1000円以下」条件が含まれる場合は株価が1000円以下の銘柄のみを選定してください。`;

const INTRO_PROMPT = (name, code, sector) =>
  `あなたは株式投資の初心者にもわかりやすく会社を紹介するライターです。「${name}（証券コード:${code}）」という${sector}の日本企業について、200〜300文字程度で紹介してください。どんな会社か、世の中とのつながり、最近の動きや強みを自然な文章で書いてください。マークダウン記法は使わないでください。`;

// ── APIキー設定モーダル ──────────────────────────────────────
function ApiKeyModal({ onSave }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState("");
  const save = () => {
    if (!val.trim().startsWith("sk-ant-")) { setErr("APIキーは sk-ant- で始まる文字列です"); return; }
    localStorage.setItem("anthropic_api_key", val.trim());
    onSave(val.trim());
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div style={{background:"#111",border:"1px solid rgba(15,255,180,0.3)",borderRadius:"12px",padding:"36px",maxWidth:"460px",width:"100%",animation:"slideUp 0.3s ease"}}>
        <div style={{fontFamily:"'Space Mono',monospace",fontSize:"10px",color:"#0fffb4",letterSpacing:"3px",marginBottom:"8px"}}>SETUP</div>
        <div style={{fontSize:"22px",fontWeight:"700",marginBottom:"8px"}}>APIキーを設定</div>
        <p style={{fontSize:"13px",color:"#777",lineHeight:"1.8",marginBottom:"24px"}}>
          <a href="https://console.anthropic.com" target="_blank" style={{color:"#0fffb4",textDecoration:"none"}}>console.anthropic.com</a> でAPIキーを取得して貼り付けてください。キーはこのデバイスにのみ保存されます。
        </p>
        <input
          type="password"
          placeholder="sk-ant-api03-..."
          value={val}
          onChange={e => { setVal(e.target.value); setErr(""); }}
          style={{width:"100%",padding:"12px 14px",background:"#0a0a0a",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"6px",color:"#e8e8e8",fontSize:"13px",fontFamily:"'Space Mono',monospace",outline:"none",marginBottom:"8px"}}
        />
        {err && <div style={{fontSize:"12px",color:"#ff6b6b",marginBottom:"10px"}}>{err}</div>}
        <button onClick={save} style={{width:"100%",padding:"13px",background:"#0fffb4",color:"#000",border:"none",borderRadius:"6px",fontSize:"14px",fontWeight:"700",cursor:"pointer",letterSpacing:"1px"}}>
          保存して始める →
        </button>
      </div>
    </div>
  );
}

// ── 詳細モーダル ─────────────────────────────────────────────
function DetailModal({ stock, apiKey, onClose }) {
  const [slide, setSlide] = useState(0);
  const [intro, setIntro] = useState("");
  const [introLoading, setIntroLoading] = useState(false);
  const signalColor = stock.signal==="BUY" ? "#0fffb4" : stock.signal==="WATCH" ? "#ffd700" : "#aaa";

  useEffect(() => {
    if (slide===0 && !intro) {
      setIntroLoading(true);
      fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:500,messages:[{role:"user",content:INTRO_PROMPT(stock.name,stock.code,stock.sector)}]})
      }).then(r=>r.json()).then(d=>setIntro(d.content?.[0]?.text||"情報を取得できませんでした")).catch(()=>setIntro("情報の取得に失敗しました。")).finally(()=>setIntroLoading(false));
    }
  }, [slide]);

  const tagStyle = color => ({padding:"3px 8px",borderRadius:"3px",fontSize:"11px",background:`${color}15`,border:`1px solid ${color}40`,color});

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}} onClick={onClose}>
      <div style={{background:"#111",border:`1px solid ${signalColor}30`,borderRadius:"12px",width:"100%",maxWidth:"480px",overflow:"hidden",animation:"fadeIn 0.2s ease"}} onClick={e=>e.stopPropagation()}>
        {/* ヘッダー */}
        <div style={{padding:"20px 20px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontFamily:"'Space Mono',monospace",fontSize:"11px",color:"#555",marginBottom:"2px"}}>{stock.code} · {stock.sector}</div>
              <div style={{fontSize:"20px",fontWeight:"700"}}>{stock.name}</div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:"#555",fontSize:"22px",cursor:"pointer",padding:"0 4px",lineHeight:1}}>×</button>
          </div>
          <div style={{display:"flex",gap:"12px",marginTop:"10px",alignItems:"center"}}>
            <span style={{fontFamily:"'Space Mono',monospace",fontSize:"18px",color:signalColor}}>¥{stock.price?.toLocaleString()}</span>
            <span style={{fontSize:"12px",color:stock.priceChange1M>=0?"#0fffb4":"#ff6b6b"}}>
              {stock.priceChange1M>=0?"▲":"▼"}{Math.abs(stock.priceChange1M)}%（1M）
            </span>
            <span style={{marginLeft:"auto",padding:"3px 10px",borderRadius:"3px",fontSize:"11px",fontWeight:"700",background:`${signalColor}20`,border:`1px solid ${signalColor}50`,color:signalColor}}>{stock.signal}</span>
          </div>
        </div>
        {/* タブ */}
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
          {[{id:0,label:"🏢 会社紹介"},{id:1,label:"📈 チャート"}].map(t=>(
            <button key={t.id} onClick={()=>setSlide(t.id)} style={{
              flex:1,padding:"11px",background:"none",border:"none",
              borderBottom:slide===t.id?`2px solid ${signalColor}`:"2px solid transparent",
              color:slide===t.id?"#f0f0f0":"#555",fontSize:"13px",cursor:"pointer",
              fontWeight:slide===t.id?"600":"400",transition:"all 0.15s"
            }}>{t.label}</button>
          ))}
        </div>
        {/* コンテンツ */}
        <div style={{minHeight:"240px",maxHeight:"420px",overflowY:"auto",padding:"20px"}}>
          {slide===0 && (
            <div style={{animation:"fadeIn 0.2s ease"}}>
              {introLoading ? (
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 0",gap:"12px"}}>
                  <div style={{width:"24px",height:"24px",border:"2px solid #222",borderTop:`2px solid ${signalColor}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                  <div style={{fontSize:"12px",color:"#555"}}>会社情報を取得中...</div>
                </div>
              ) : (
                <>
                  <p style={{fontSize:"14px",color:"#ccc",lineHeight:"1.85",marginBottom:"16px"}}>{intro}</p>
                  <div style={{padding:"12px 14px",background:`${signalColor}08`,borderRadius:"8px",border:`1px solid ${signalColor}20`}}>
                    <div style={{fontSize:"10px",color:signalColor,marginBottom:"5px",fontWeight:"600"}}>📌 選定理由</div>
                    <p style={{fontSize:"12px",color:"#aaa",lineHeight:"1.7"}}>{stock.reason}</p>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"14px"}}>
                    {stock.nearLow && <span style={tagStyle("#ff6b6b")}>📉 5年安値近辺 +{stock.lowRatio}%</span>}
                    {stock.undervalued && <span style={tagStyle("#ffd700")}>💎 割安</span>}
                    {stock.nisaGrowth && <span style={tagStyle("#0fffb4")}>🌱 NISA対応</span>}
                    {(stock.tags||[]).map(t=><span key={t} style={tagStyle("#888")}>{t}</span>)}
                  </div>
                </>
              )}
            </div>
          )}
          {slide===1 && (
            <div style={{animation:"fadeIn 0.2s ease"}}>
              <div style={{fontSize:"13px",color:"#777",marginBottom:"16px"}}>外部サイトでチャートを確認できます：</div>
              <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                {[
                  {label:"Yahoo!ファイナンス",url:`https://finance.yahoo.co.jp/quote/${stock.code}.T`,color:"#ff6b00"},
                  {label:"かぶたん",url:`https://kabutan.jp/stock/chart?code=${stock.code}`,color:"#0088ff"},
                  {label:"TradingView",url:`https://jp.tradingview.com/chart/?symbol=TSE:${stock.code}`,color:"#2962ff"},
                ].map(cl=>(
                  <a key={cl.label} href={cl.url} target="_blank" rel="noopener noreferrer" style={{
                    display:"flex",alignItems:"center",justifyContent:"space-between",
                    padding:"14px 16px",borderRadius:"8px",
                    background:`${cl.color}10`,border:`1px solid ${cl.color}30`,
                    color:cl.color,textDecoration:"none",fontSize:"14px",fontWeight:"600"
                  }}>
                    <span>{cl.label}</span><span>→</span>
                  </a>
                ))}
              </div>
              <div style={{marginTop:"20px",padding:"12px 14px",background:"rgba(255,255,255,0.03)",borderRadius:"8px"}}>
                <div style={{fontSize:"10px",color:"#555",fontFamily:"'Space Mono',monospace",marginBottom:"8px",letterSpacing:"1px"}}>基本指標</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"12px"}}>
                  {[["PER",`${stock.per}倍`],["PBR",`${stock.pbr}倍`],["配当",`${stock.dividendYield}%`]].map(([k,v])=>(
                    <div key={k}>
                      <div style={{fontSize:"10px",color:"#555"}}>{k}</div>
                      <div style={{fontSize:"14px",fontFamily:"'Space Mono',monospace",color:"#ddd"}}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── 銘柄カード ───────────────────────────────────────────────
function StockCard({ stock, onSelect }) {
  const signalColor = stock.signal==="BUY" ? "#0fffb4" : stock.signal==="WATCH" ? "#ffd700" : "#aaa";
  return (
    <div style={{background:"#111",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"10px",padding:"16px 18px",animation:"fadeIn 0.3s ease",borderLeft:`3px solid ${signalColor}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
        <div>
          <div style={{fontSize:"10px",color:"#555",fontFamily:"'Space Mono',monospace",marginBottom:"2px"}}>{stock.code} · {stock.sector}</div>
          <button onClick={()=>onSelect(stock)} style={{
            background:"none",border:"none",padding:0,cursor:"pointer",textAlign:"left",
            fontSize:"17px",fontWeight:"700",color:"#e8e8e8",
            textDecoration:"underline",textUnderlineOffset:"3px",textDecorationColor:"rgba(15,255,180,0.5)"
          }}>{stock.name}</button>
        </div>
        <span style={{padding:"3px 10px",borderRadius:"3px",fontSize:"11px",fontWeight:"700",background:`${signalColor}20`,border:`1px solid ${signalColor}50`,color:signalColor,whiteSpace:"nowrap"}}>{stock.signal}</span>
      </div>
      <div style={{display:"flex",gap:"20px",marginBottom:"10px"}}>
        <div><div style={{fontSize:"10px",color:"#555"}}>株価</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:"16px"}}>¥{stock.price?.toLocaleString()}</div></div>
        <div><div style={{fontSize:"10px",color:"#555"}}>配当利回り</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:"16px",color:"#ffd700"}}>{stock.dividendYield}%</div></div>
        <div><div style={{fontSize:"10px",color:"#555"}}>1ヶ月</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:"16px",color:stock.priceChange1M>=0?"#0fffb4":"#ff6b6b"}}>{stock.priceChange1M>=0?"▲":"▼"}{Math.abs(stock.priceChange1M)}%</div></div>
      </div>
      <div style={{fontSize:"12px",color:"#888",lineHeight:"1.6",borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:"10px"}}>{stock.reason}</div>
    </div>
  );
}

// ── メインアプリ ─────────────────────────────────────────────
function App() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("anthropic_api_key") || "");
  const [selected, setSelected] = useState(new Set());
  const [sector, setSector] = useState("全業種");
  const [stocks, setStocks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [lastUpdated, setLastUpdated] = useState("");
  const [detailStock, setDetailStock] = useState(null);

  const toggleCondition = id => setSelected(s => { const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });

  const scan = useCallback(async () => {
    if (selected.size===0) { setError("条件を1つ以上選択してください"); return; }
    setLoading(true); setError(""); setStocks([]);
    const condLabels = [...selected].map(id=>CONDITIONS_LIST.find(c=>c.id===id)?.label).join("、");
    const prompt = SYSTEM_PROMPT.replace("{CONDITIONS}", `${condLabels}${sector!=="全業種"?`、セクター:${sector}`:""}`);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:2000,system:prompt,messages:[{role:"user",content:"上記条件でスクリーニングしてJSON配列のみ返してください。"}]})
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.[0]?.text || "";
      const clean = text.replace(/```json|```/g,"").trim();
      setStocks(JSON.parse(clean));
      setLastUpdated(new Date().toLocaleTimeString("ja-JP"));
    } catch(e) {
      setError("エラー: "+e.message);
    } finally {
      setLoading(false);
    }
  }, [selected, sector, apiKey]);

  if (!apiKey) return <ApiKeyModal onSave={setApiKey}/>;

  return (
    <div style={{minHeight:"100vh",background:"#0a0a0a",color:"#e8e8e8"}}>
      {detailStock && <DetailModal stock={detailStock} apiKey={apiKey} onClose={()=>setDetailStock(null)}/>}

      {/* ヘッダー */}
      <div style={{borderBottom:"1px solid rgba(255,255,255,0.06)",padding:"18px 20px 14px",background:"rgba(15,255,180,0.015)",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(14px)"}}>
        <div style={{maxWidth:"680px",margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
              <div style={{width:"7px",height:"7px",borderRadius:"50%",background:"#0fffb4",boxShadow:"0 0 8px #0fffb4",animation:stocks.length>0?"pulse 2.2s infinite":"none"}}/>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:"10px",color:"#0fffb4",letterSpacing:"3px"}}>JP STOCK SCREENER</span>
            </div>
            <div style={{fontSize:"20px",fontWeight:"700",marginTop:"3px"}}>日本株スクリーナー</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            {lastUpdated&&<div style={{textAlign:"right"}}><div style={{fontSize:"9px",color:"#555",fontFamily:"'Space Mono',monospace"}}>UPDATED</div><div style={{fontSize:"11px",color:"#666",fontFamily:"'Space Mono',monospace"}}>{lastUpdated}</div></div>}
            <button onClick={()=>{localStorage.removeItem("anthropic_api_key");setApiKey("");}} title="APIキーを変更" style={{padding:"6px 10px",background:"none",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"5px",color:"#555",fontSize:"12px",cursor:"pointer"}}>🔑</button>
          </div>
        </div>
      </div>

      <div style={{padding:"20px",maxWidth:"680px",margin:"0 auto"}}>
        {/* 条件 */}
        <div style={{marginBottom:"14px"}}>
          <div style={{fontSize:"9px",color:"#555",letterSpacing:"2.5px",marginBottom:"8px",fontFamily:"'Space Mono',monospace"}}>SCREENING CONDITIONS</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>
            {CONDITIONS_LIST.map(c=>{
              const active=selected.has(c.id);
              return <button key={c.id} onClick={()=>toggleCondition(c.id)} style={{
                padding:"7px 13px",borderRadius:"5px",cursor:"pointer",
                border:active?"1px solid #0fffb4":"1px solid rgba(255,255,255,0.09)",
                background:active?"rgba(15,255,180,0.08)":"rgba(255,255,255,0.02)",
                color:active?"#0fffb4":"#777",fontSize:"13px",transition:"all 0.14s",display:"flex",alignItems:"center",gap:"6px"
              }}><span>{c.icon}</span><span>{c.label}</span></button>;
            })}
          </div>
        </div>

        {/* セクター */}
        <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"16px",flexWrap:"wrap"}}>
          <div style={{fontSize:"9px",color:"#555",fontFamily:"'Space Mono',monospace",letterSpacing:"2px",whiteSpace:"nowrap"}}>SECTOR</div>
          <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
            {SECTORS.map(s=><button key={s} onClick={()=>setSector(s)} style={{
              padding:"5px 10px",borderRadius:"3px",cursor:"pointer",
              border:sector===s?"1px solid #ffd700":"1px solid rgba(255,255,255,0.07)",
              background:sector===s?"rgba(255,215,0,0.07)":"transparent",
              color:sector===s?"#ffd700":"#666",fontSize:"11px",transition:"all 0.14s"
            }}>{s}</button>)}
          </div>
        </div>

        {/* SCANボタン */}
        <button onClick={scan} disabled={loading} style={{
          width:"100%",padding:"14px",borderRadius:"8px",cursor:loading?"not-allowed":"pointer",
          background:loading?"rgba(15,255,180,0.05)":"rgba(15,255,180,0.12)",
          border:"1px solid rgba(15,255,180,0.3)",color:"#0fffb4",
          fontSize:"14px",fontWeight:"700",letterSpacing:"2px",fontFamily:"'Space Mono',monospace",
          transition:"all 0.15s",marginBottom:"20px"
        }}>{loading?"🔍 スキャン中...":"▶ SCAN"}</button>

        {error&&<div style={{color:"#ff6b6b",fontSize:"13px",marginBottom:"16px",padding:"10px 14px",background:"rgba(255,107,107,0.08)",borderRadius:"6px",border:"1px solid rgba(255,107,107,0.2)"}}>{error}</div>}

        {/* 結果 */}
        {stocks.length>0&&(
          <div>
            <div style={{fontSize:"9px",color:"#555",letterSpacing:"2.5px",marginBottom:"12px",fontFamily:"'Space Mono',monospace"}}>RESULTS — {stocks.length} STOCKS</div>
            <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
              {stocks.map(s=><StockCard key={s.code} stock={s} onSelect={setDetailStock}/>)}
            </div>
          </div>
        )}

        {stocks.length===0&&!loading&&(
          <div style={{textAlign:"center",padding:"60px 20px",color:"#333"}}>
            <div style={{fontSize:"40px",marginBottom:"14px"}}>📊</div>
            <div style={{fontFamily:"'Space Mono',monospace",fontSize:"12px",letterSpacing:"2px",color:"#444"}}>条件を選んでSCANしてください</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
