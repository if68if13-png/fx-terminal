<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Terminal 管理画面</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 24px; }
h1 { font-size: 1.2rem; margin-bottom: 24px; color: #00d4ff; }
.section { background: #161b22; border: 1px solid #1a2332; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.section h2 { font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; color: #4a5568; margin-bottom: 14px; }
textarea { width: 100%; background: #0d1117; border: 1px solid #1a2332; border-radius: 6px; color: #c9d1d9; padding: 12px; font-size: 0.9rem; line-height: 1.6; resize: vertical; font-family: sans-serif; }
input[type="text"] { width: 100%; background: #0d1117; border: 1px solid #1a2332; border-radius: 6px; color: #c9d1d9; padding: 10px 12px; font-size: 0.9rem; margin-bottom: 10px; }
.btn { background: #00d4ff; color: #0d1117; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; width: 100%; margin-top: 10px; }
.btn:hover { opacity: 0.85; }
.msg { font-size: 0.8rem; margin-top: 8px; color: #00ff88; display: none; }
</style>
</head>
<body>
<h1>FX Terminal 管理画面</h1>

<div class="section">
  <h2>長期の根拠（手動・たまに更新）</h2>
  <textarea id="long_reason" rows="4" placeholder="例：日米金利差が続く限り構造的な円安基調は変わらない..."></textarea>
</div>

<div class="section">
  <h2>FedWatch 所感（週1回程度）</h2>
  <textarea id="fedwatch" rows="3" placeholder="例：6月据え置き96%確実。年末にかけて375-400への利上げ織り込みが強まっている。Warsh議長のタカ派姿勢が市場に浸透しつつある。"></textarea>
</div>

<div class="section">
  <h2>開発者コメント（相場の補足）</h2>
  <textarea id="dev_comment" rows="4" placeholder="例：今週は介入警戒のため様子見。AIはロング優勢と出ていますが..."></textarea>
</div>

<div class="section">
  <h2>日記・ひとこと</h2>
  <textarea id="diary" rows="4" placeholder="例：夜勤明けでドル円見たら介入入ってた笑　今週はゆっくり様子見します。"></textarea>
</div>

<button class="btn" onclick="save()">保存してサイトに反映</button>
<div class="msg" id="msg">✅ 保存完了！GitHubに反映中...</div>

<script>
function save() {
  const data = {
    fedwatch: document.getElementById('fedwatch').value,
    long_reason: document.getElementById('long_reason').value,
    dev_comment: document.getElementById('dev_comment').value,
    diary_work:   document.getElementById('diary_work').value,
    diary_market: document.getElementById('diary_market').value,
    diary_trade:  document.getElementById('diary_trade').value,
    diary: document.getElementById('diary_work').value + '\n' + document.getElementById('diary_market').value + '\n' + document.getElementById('diary_trade').value,
    updated: new Date().toLocaleDateString('ja-JP')
  };

  fetch('http://localhost:8765/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(r => r.json()).then(d => {
    document.getElementById('msg').style.display = 'block';
    setTimeout(() => document.getElementById('msg').style.display = 'none', 3000);
  }).catch(e => alert('サーバーが起動していません。ターミナルでサーバーを起動してください。'));
}

// ページ読み込み時に既存データを復元
window.addEventListener('load', () => {
  fetch('http://localhost:8765/load')
    .then(r => r.json())
    .then(data => {
      if (data.fedwatch)    document.getElementById('fedwatch').value    = data.fedwatch;
      if (data.long_reason) document.getElementById('long_reason').value = data.long_reason;
      if (data.dev_comment) document.getElementById('dev_comment').value = data.dev_comment;
      if (data.diary_work)   document.getElementById('diary_work').value   = data.diary_work;
      if (data.diary_market) document.getElementById('diary_market').value = data.diary_market;
      if (data.diary_trade)  document.getElementById('diary_trade').value  = data.diary_trade;
    })
    .catch(() => {});
});
</script>
</body>
</html>
