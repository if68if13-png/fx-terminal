<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Terminal 管理画面</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 24px; }
h1 { font-size: 1.2rem; margin-bottom: 24px; color: #00d4ff; }
.section { background: #161b22; border: 1px solid #1a2332; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.section h2 { font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; color: #4a5568; margin-bottom: 14px; }
textarea { width: 100%; background: #0d1117; border: 1px solid #1a2332; border-radius: 6px; color: #c9d1d9; padding: 12px; font-size: 0.9rem; line-height: 1.6; resize: vertical; font-family: sans-serif; }
input[type="text"] { width: 100%; background: #0d1117; border: 1px solid #1a2332; border-radius: 6px; color: #c9d1d9; padding: 10px 12px; font-size: 0.9rem; margin-bottom: 10px; }
.btn { background: #00d4ff; color: #0d1117; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; width: 100%; margin-top: 10px; }
.btn:hover { opacity: 0.85; }
.msg { font-size: 0.8rem; margin-top: 8px; color: #00ff88; display: none; }
</style>
</head>
<body>
<h1>FX Terminal 管理画面</h1>

<div class="section">
  <h2>長期の根拠（手動・たまに更新）</h2>
  <textarea id="long_reason" rows="4" placeholder="例：日米金利差が続く限り構造的な円安基調は変わらない..."></textarea>
</div>

<div class="section">
  <h2>🏦 中銀スタンス（金利差の方向性）</h2>
  <div style="font-size:.72rem;color:#4a5568;margin-bottom:12px">利上げ方向：+1 / 据え置き：0 / 利下げ方向：-1　※中銀イベント後に更新</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇺🇸 USD（FRB）</label>
      <select id="cb_USD" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇯🇵 JPY（BOJ）</label>
      <select id="cb_JPY" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇪🇺 EUR（ECB）</label>
      <select id="cb_EUR" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇬🇧 GBP（BOE）</label>
      <select id="cb_GBP" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇦🇺 AUD（RBA）</label>
      <select id="cb_AUD" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1" selected>-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇳🇿 NZD（RBNZ）</label>
      <select id="cb_NZD" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1" selected>+1 利上げ方向</option>
        <option value="0">0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇨🇦 CAD（BOC）</label>
      <select id="cb_CAD" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
    <div>
      <label style="font-size:.72rem;color:#00d4ff;display:block;margin-bottom:4px">🇨🇭 CHF（SNB）</label>
      <select id="cb_CHF" style="width:100%;background:#0d1117;border:1px solid #1a2332;border-radius:6px;color:#c9d1d9;padding:8px;font-size:.85rem">
        <option value="2">+2 強く利上げ方向</option>
        <option value="1">+1 利上げ方向</option>
        <option value="0" selected>0 据え置き</option>
        <option value="-1">-1 利下げ方向</option>
        <option value="-2">-2 強く利下げ方向</option>
      </select>
    </div>
  </div>
</div>

<div class="section">
  <h2>FedWatch 所感（週1回程度）</h2>
  <textarea id="fedwatch" rows="3" placeholder="例：6月据え置き96%確実。年末にかけて375-400への利上げ織り込みが強まっている。Warsh議長のタカ派姿勢が市場に浸透しつつある。"></textarea>
</div>

<div class="section">
  <h2>開発者コメント（相場の補足）</h2>
  <textarea id="dev_comment" rows="4" placeholder="例：今週は介入警戒のため様子見。AIはロング優勢と出ていますが..."></textarea>
</div>

<div class="section">
  <h2>日記</h2>
  <label style="font-size:.75rem;color:#4a5568;display:block;margin-bottom:4px">📋 勤務</label>
  <textarea id="diary_work" rows="2" placeholder="例：日勤、夜勤明け、公休など"></textarea>
  <label style="font-size:.75rem;color:#4a5568;display:block;margin:10px 0 4px">📊 相場感</label>
  <textarea id="diary_market" rows="3" placeholder="例：ドル円は155円台で膠着。介入警戒で上値重い。来週のFOMC待ち。"></textarea>
  <label style="font-size:.75rem;color:#4a5568;display:block;margin:10px 0 4px">💰 トレード実績</label>
  <textarea id="diary_trade" rows="2" placeholder="例：USDJPY ロング 155.20→155.80 +60pips。ノートレ。"></textarea>
</div>

<button class="btn" onclick="save()">保存してサイトに反映</button>
<div class="msg" id="msg">✅ 保存完了！GitHubに反映中...</div>

<script>
function save() {
  const data = {
    fedwatch: document.getElementById('fedwatch').value,
    long_reason: document.getElementById('long_reason').value,
    dev_comment: document.getElementById('dev_comment').value,
    diary_work:   document.getElementById('diary_work').value,
    diary_market: document.getElementById('diary_market').value,
    diary_trade:  document.getElementById('diary_trade').value,
    diary: document.getElementById('diary_work').value + '\n' + document.getElementById('diary_market').value + '\n' + document.getElementById('diary_trade').value,
    updated: new Date().toLocaleDateString('ja-JP'),
    cb_outlook: {
      USD: parseInt(document.getElementById('cb_USD').value),
      JPY: parseInt(document.getElementById('cb_JPY').value),
      EUR: parseInt(document.getElementById('cb_EUR').value),
      GBP: parseInt(document.getElementById('cb_GBP').value),
      AUD: parseInt(document.getElementById('cb_AUD').value),
      NZD: parseInt(document.getElementById('cb_NZD').value),
      CAD: parseInt(document.getElementById('cb_CAD').value),
      CHF: parseInt(document.getElementById('cb_CHF').value),
    }
  };

  fetch('http://localhost:8765/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(r => r.json()).then(d => {
    document.getElementById('msg').style.display = 'block';
    setTimeout(() => document.getElementById('msg').style.display = 'none', 3000);
  }).catch(e => alert('サーバーが起動していません。ターミナルでサーバーを起動してください。'));
}

// ページ読み込み時に既存データを復元
window.addEventListener('load', () => {
  fetch('http://localhost:8765/load')
    .then(r => r.json())
    .then(data => {
      if (data.fedwatch)    document.getElementById('fedwatch').value    = data.fedwatch;
      if (data.long_reason) document.getElementById('long_reason').value = data.long_reason;
      if (data.dev_comment) document.getElementById('dev_comment').value = data.dev_comment;
      if (data.diary_work)   document.getElementById('diary_work').value   = data.diary_work;
      if (data.diary_market) document.getElementById('diary_market').value = data.diary_market;
      if (data.diary_trade)  document.getElementById('diary_trade').value  = data.diary_trade;
      if (data.cb_outlook) {
        const cb = data.cb_outlook;
        ['USD','JPY','EUR','GBP','AUD','NZD','CAD','CHF'].forEach(cur => {
          const el = document.getElementById('cb_'+cur);
          if (el && cb[cur] !== undefined) el.value = String(cb[cur]);
        });
      }
    })
    .catch(() => {});
});
</script>
</body>
</html>
