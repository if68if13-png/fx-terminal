<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--panel:#0d1117;--border:#1a2332;--accent:#00d4ff;--green:#00ff88;--red:#ff3366;--yellow:#ffcc00;--text:#c9d1d9;--dim:#4a5568;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",monospace;min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:24px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.title{font-family:"Bebas Neue",sans-serif;font-size:2.8rem;letter-spacing:4px;color:var(--accent);text-shadow:0 0 30px rgba(0,212,255,0.5);}
.subtitle{font-size:0.65rem;color:var(--dim);letter-spacing:3px;margin-top:4px;}
.live{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.ts{font-size:0.72rem;color:var(--dim);}
.status{font-size:0.65rem;color:var(--accent);margin-top:6px;letter-spacing:1px;}
.warn{background:rgba(255,204,0,0.05);border:1px solid rgba(255,204,0,0.2);border-radius:4px;padding:10px 16px;font-size:0.62rem;color:var(--yellow);margin-bottom:20px;font-family:"Noto Sans JP",sans-serif;}
.grid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:16px;margin-bottom:16px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px;position:relative;overflow:hidden;}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.3;}
.plabel{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.plabel::after{content:"";flex:1;height:1px;background:var(--border);}
.crow{display:grid;grid-template-columns:40px 1fr 36px;align-items:center;gap:10px;margin-bottom:10px;}
.cname{font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:2px;}
.btrack{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bfill{height:100%;border-radius:3px;}
.pos{background:linear-gradient(90deg,var(--green),rgba(0,255,136,0.5));box-shadow:0 0 10px rgba(0,255,136,0.3);}
.neg{background:linear-gradient(90deg,var(--red),rgba(255,51,102,0.5));box-shadow:0 0 10px rgba(255,51,102,0.3);}
.neu{background:var(--dim);width:2px!important;}
.sval{font-size:0.75rem;font-weight:600;text-align:right;}
.sval.pos{color:var(--green);}.sval.neg{color:var(--red);}.sval.neu{color:var(--dim);}
.prow{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:3px;margin-bottom:8px;background:rgba(255,255,255,0.02);transition:border-color 0.2s;}
.prow:hover{border-color:var(--accent);}
.pname{font-family:"Bebas Neue",sans-serif;font-size:1.1rem;letter-spacing:3px;}
.pdir{font-size:0.7rem;font-weight:600;}
.sl{color:var(--green);text-shadow:0 0 10px rgba(0,255,136,0.5);}.l{color:rgba(0,255,136,0.7);}.ss{color:var(--red);text-shadow:0 0 10px rgba(255,51,102,0.5);}.s{color:rgba(255,51,102,0.7);}.n{color:var(--dim);}
.nlist{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;}
.nlist::-webkit-scrollbar{width:2px;}.nlist::-webkit-scrollbar-thumb{background:var(--accent);}
.nitem{padding:10px;border-left:2px solid var(--border);background:rgba(255,255,255,0.01);border-radius:0 3px 3px 0;transition:all 0.2s;}
.nitem:hover{border-color:var(--accent);background:rgba(0,212,255,0.03);}
.nsrc{font-size:0.55rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.ntitle{font-family:"Noto Sans JP",sans-serif;font-size:0.72rem;line-height:1.5;}
.cotg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.coti{text-align:center;padding:10px 6px;border:1px solid var(--border);border-radius:3px;}
.cotc{font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:2px;margin-bottom:3px;}
.cotb{font-size:0.6rem;letter-spacing:1px;}.cotn{font-size:0.6rem;color:var(--dim);margin-top:2px;}
.rlist{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow-y:auto;}
.ritem{font-size:0.62rem;padding:5px 8px;border-left:1px solid var(--border);color:var(--dim);font-family:"Noto Sans JP",sans-serif;line-height:1.4;}
.rcur{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:0.6rem;margin-right:4px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:8px 16px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:12px;transition:all 0.2s;}
.btn:hover{background:rgba(0,212,255,0.08);}
.gtime{font-size:0.58rem;color:var(--dim);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div>
    <div class="title">FX TERMINAL</div>
    <div class="subtitle">Fundamental Analysis Dashboard</div>
  </div>
  <div style="text-align:right">
    <div class="ts"><span class="live"></span><span id="clk"></span></div>
    <div class="status" id="status">🔄 起動中...</div>
  </div>
</div>
<div class="warn">⚠️ 自動分析レポートです。最終的なトレード判断は必ずご自身で行ってください。</div>
<div class="grid">
  <div class="panel">
    <div class="plabel">通貨強弱スコア</div>
    <div id="clist"></div>
  </div>
  <div class="panel">
    <div class="plabel">ペア方向性</div>
    <div id="plist"></div>
  </div>
  <div class="panel" style="grid-row:span 2">
    <div class="plabel">FX関連ニュース</div>
    <div class="nlist" id="nlist"></div>
  </div>
  <div class="panel">
    <div class="plabel">COT 機関投資家ポジション</div>
    <div class="cotg" id="cotg"></div>
  </div>
  <div class="panel">
    <div class="plabel">スコア根拠</div>
    <div class="rlist" id="rlist"></div>
    <button class="btn" onclick="fetchLatestData()">▶ 今すぐ更新</button>
    <div class="gtime">ページを開くと自動更新 / 30分ごとに自動更新</div>
  </div>
</div>
</div>
<script>
let DATA = {"timestamp": "2026-05-08T01:35:40.121479", "generated": "2026年05月08日 01:35", "scores": {"USD": -1, "JPY": 0, "EUR": 0, "GBP": 0, "AUD": 0, "NZD": 0, "CAD": 0, "CHF": 0}, "pairs": [{"pair": "USDJPY", "direction": "様子見", "diff": -1, "base_score": -1, "quote_score": 0}, {"pair": "EURUSD", "direction": "様子見", "diff": 1, "base_score": 0, "quote_score": -1}, {"pair": "GBPUSD", "direction": "様子見", "diff": 1, "base_score": 0, "quote_score": -1}, {"pair": "AUDUSD", "direction": "様子見", "diff": 1, "base_score": 0, "quote_score": -1}, {"pair": "EURJPY", "direction": "様子見", "diff": 0, "base_score": 0, "quote_score": 0}, {"pair": "GBPJPY", "direction": "様子見", "diff": 0, "base_score": 0, "quote_score": 0}], "news": [{"source": "Fed", "title": "Federal Reserve issues FOMC statement", "summary": "Federal Reserve issues FOMC statement"}, {"source": "Fed", "title": "Federal Reserve Board announces approval of application by OceanFirst Financial Corp.", "summary": "Federal Reserve Board announces approval of application by OceanFirst Financial Corp."}, {"source": "Fed", "title": "Federal Reserve Board announces approval of application by Banco de Credito del Peru", "summary": "Federal Reserve Board announces approval of application by Banco de Credito del Peru"}, {"source": "Fed", "title": "Federal Reserve Board issues enforcement action with former employee of First Financial Bank", "summary": "Federal Reserve Board issues enforcement action with former employee of First Financial Bank"}, {"source": "Fed", "title": "Federal Reserve Board issues enforcement action with Community Bankshares, Inc.", "summary": "Federal Reserve Board issues enforcement action with Community Bankshares, Inc."}, {"source": "Fed", "title": "Minutes of the Board’s discount rate meetings on February 9 and March 18, 2026", "summary": "Minutes of the Board’s discount rate meetings on February 9 and March 18, 2026"}, {"source": "Fed", "title": "Federal Reserve Board announces approval of application by Burke & Herbert Financial Services Corp.", "summary": "Federal Reserve Board announces approval of application by Burke &amp; Herbert Financial Services Corp."}, {"source": "Fed", "title": "Federal Reserve Board announces termination of enforcement actions with Crédit Agricole S.A. and Crédit Agricole Corporate and Investment Bank, Mega International Commercial Bank Co., Ltd, and the Goldman Sachs Group, Inc.", "summary": "Federal Reserve Board announces termination of enforcement actions with Cr&eacute;dit Agricole S.A. and Cr&eacute;dit Ag"}, {"source": "FXStreet", "title": "EUR/USD: Sentiment-led rally eyes 1.1825 – Scotiabank", "summary": "Scotiabank strategists Shaun Osborne and Eric Theoret report the Euro (EUR) is modestly higher, extending a sentiment-dr"}, {"source": "FXStreet", "title": "Fed’s Hammack: Fed should be neutral in policy stance", "summary": "Beth Hammack, President of the Federal Reserve (Fed) Bank of Cleveland, in an interview on a public radio station on Thu"}, {"source": "FXStreet", "title": "USD/JPY muted as easing Middle East tensions weigh on US Dollar", "summary": "The USD/JPY pair is currently trading around the 156.40 level, showing minimal change throughout the day. This stability"}, {"source": "FXStreet", "title": "Gold extends rally as traders reassess Fed outlook amid softer Oil prices", "summary": "Gold (XAU/USD) extends its advance on Thursday, climbing to over two-week highs as price action remains driven by geopol"}, {"source": "FXStreet", "title": "USD/CHF slides to two-month low as US-Iran deal hopes weigh on Dollar", "summary": "The Swiss Franc (CHF) strengthens against the US Dollar (USD) on Thursday as renewed hopes for a possible US-Iran peace "}, {"source": "FXStreet", "title": "Fed: Higher-for-longer stance weighs on Gold – TD Securities", "summary": "TD Securities strategist Bart Melek notes that the latest FOMC decision and the Iran-related Oil shock are pushing the F"}, {"source": "FXStreet", "title": "USD/CAD: Bear trend intact below 1.3645 – Scotiabank", "summary": "Scotiabank strategists Shaun Osborne and Eric Theoret note the Canadian Dollar (CAD) is little changed as traders await "}, {"source": "FXStreet", "title": "GBP/USD: Election risks weigh on Pound – Societe Generale", "summary": "Societe Generale’s team highlights that GBP/USD has edged higher, helped by lower Oil prices, risk correlations and Asia"}, {"source": "Investing", "title": "Kraken launches virtual IBANs in four European countries with salary match", "summary": ""}, {"source": "Investing", "title": "Bitcoin pulls back as markets eye Iran progress, Strategy sales", "summary": ""}, {"source": "Investing", "title": "Bitcoin flat as Strategy flags potential sales, but still at over three-month high", "summary": ""}, {"source": "Investing", "title": "Roobet Launches Prediction Markets on May 6, The First Major Crypto Casino to Integrate the Format", "summary": ""}], "cot": {}, "reasons": {"USD": ["[弱気] Fed: Higher-for-longer stance weighs on Gold – TD Secur"]}};

function renderAll(d){
  const sorted=Object.entries(d.scores).sort((a,b)=>b[1]-a[1]);
  document.getElementById('clist').innerHTML=sorted.map(([c,s])=>{
    const cls=s>0?'pos':s<0?'neg':'neu';
    const pct=s===0?1:Math.abs(s)/5*100;
    return `<div class="crow"><div class="cname">${c}</div><div class="btrack"><div class="bfill ${cls}" style="width:${pct}%"></div></div><div class="sval ${cls}">${s>0?'+':''}${s}</div></div>`;
  }).join('');
  document.getElementById('plist').innerHTML=d.pairs.map(p=>{
    let cls='n',label='⚪ 様子見';
    if(p.direction.includes('強くロング')){cls='sl';label='🟢🟢 強くロング';}
    else if(p.direction.includes('ロング')){cls='l';label='🟢 ロング優勢';}
    else if(p.direction.includes('強くショート')){cls='ss';label='🔴🔴 強くショート';}
    else if(p.direction.includes('ショート')){cls='s';label='🔴 ショート優勢';}
    return `<div class="prow"><div class="pname">${p.pair}</div><div class="pdir ${cls}">${label}</div><div style="font-size:0.65rem;color:var(--dim)">${p.diff>0?'+':''}${p.diff}</div></div>`;
  }).join('');
  document.getElementById('nlist').innerHTML=(d.news||[]).map(n=>`<div class="nitem"><div class="nsrc">${n.source}</div><div class="ntitle">${n.title}</div></div>`).join('')||'<div class="ritem">ニュース取得中...</div>';
  const ce=Object.entries(d.cot||{});
  document.getElementById('cotg').innerHTML=ce.length?ce.map(([c,v])=>`<div class="coti"><div class="cotc" style="color:${v.net>0?'var(--green)':'var(--red)'}">${c}</div><div class="cotb" style="color:${v.net>0?'var(--green)':'var(--red)'}">${v.net>0?'▲ LONG':'▼ SHORT'}</div><div class="cotn">${v.net>0?'+':''}${v.net.toLocaleString()}</div></div>`).join(''):'<div class="ritem" style="grid-column:span 3;text-align:center;padding:20px">COTデータ取得中...</div>';
  const items=[];
  for(const[c,list]of Object.entries(d.reasons||{}))for(const r of list)items.push(`<div class="ritem"><span class="rcur">${c}</span>${r}</div>`);
  document.getElementById('rlist').innerHTML=items.join('')||'<div class="ritem">根拠データなし</div>';
}

async function fetchLatestData(){
  const statusEl=document.getElementById('status');
  statusEl.textContent='🔄 データ取得中...';
  try{
    const r=await fetch('fx_data.json?t='+Date.now());
    const d=await r.json();
    renderAll(d);
    statusEl.textContent='✅ '+d.generated+' 更新済';
  }catch(e){
    renderAll(DATA);
    statusEl.textContent='📁 保存データを表示中';
  }
}

setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleString('ja-JP'),1000);

// ページを開いたら自動更新
window.addEventListener('load', fetchLatestData);
// 30分ごとに自動更新
setInterval(fetchLatestData, 30*60*1000);
</script>
</body>
</html>
