<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --border: #e2e5ea;
  --text: #1a1d23;
  --muted: #6b7280;
  --hint: #9ca3af;
  --green: #1D9E75;
  --green-bg: #E1F5EE;
  --green-text: #085041;
  --red: #E24B4A;
  --red-bg: #FCEBEB;
  --red-text: #791F1F;
  --yellow: #BA7517;
  --yellow-bg: #FAEEDA;
  --yellow-text: #633806;
  --blue: #185FA5;
  --blue-bg: #E6F1FB;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", sans-serif;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* ヘッダー */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 36px;
  height: 36px;
  background: var(--text);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: "DM Mono", monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.5px;
}

.logo-text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
}

.logo-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  animation: pulse 2s infinite;
}

@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.ts {
  font-size: 12px;
  color: var(--muted);
  font-family: "DM Mono", monospace;
}

.status-badge {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 500;
}

/* 警告バー */
.warn {
  background: var(--yellow-bg);
  border: 1px solid #FAC775;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--yellow-text);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* タブ（スマホ） */
.tabs {
  display: none;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.tab {
  flex: none;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.tab.active {
  background: var(--text);
  color: white;
  border-color: var(--text);
}

/* グリッド */
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 16px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* パネル */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}

.panel-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 通貨強弱 */
.crow {
  display: grid;
  grid-template-columns: 36px 1fr 52px;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.crow:last-child { margin-bottom: 0; }

.cname {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-family: "DM Mono", monospace;
}

.btrack {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.bfill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

.bfill.pos { background: var(--green); }
.bfill.neg { background: var(--red); }
.bfill.neu { width: 3px !important; background: var(--border); }

.score-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  text-align: center;
  font-family: "DM Mono", monospace;
}

.score-badge.pos { background: var(--green-bg); color: var(--green-text); }
.score-badge.neg { background: var(--red-bg); color: var(--red-text); }
.score-badge.neu { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

/* ペア */
.prow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: var(--bg);
  transition: background 0.15s;
}

.prow:last-child { margin-bottom: 0; }
.prow:hover { background: #eef0f3; }

.pname {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  font-family: "DM Mono", monospace;
  letter-spacing: 0.5px;
}

.dir-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
}

.dir-badge.sl { background: var(--green); color: white; }
.dir-badge.l { background: var(--green-bg); color: var(--green-text); }
.dir-badge.ss { background: var(--red); color: white; }
.dir-badge.s { background: var(--red-bg); color: var(--red-text); }
.dir-badge.n { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

.diff-num {
  font-size: 11px;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  min-width: 24px;
  text-align: right;
}

/* ニュース */
.nlist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 420px;
  overflow-y: auto;
  padding-right: 4px;
}

.nlist::-webkit-scrollbar { width: 3px; }
.nlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.nitem {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  transition: background 0.15s;
}

.nitem:hover { background: #eef0f3; }

.nsrc {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 4px;
}

.ntitle {
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}

/* COT */
.cotg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.coti {
  text-align: center;
  padding: 10px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
}

.cotc { font-size: 13px; font-weight: 700; font-family: "DM Mono", monospace; margin-bottom: 3px; }
.cotb { font-size: 11px; font-weight: 500; }
.cotn { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: "DM Mono", monospace; }

/* 根拠 */
.rlist {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 160px;
  overflow-y: auto;
}

.ritem {
  font-size: 11px;
  padding: 6px 10px;
  border-left: 2px solid var(--border);
  color: var(--muted);
  background: var(--bg);
  border-radius: 0 6px 6px 0;
  line-height: 1.5;
}

.rcur {
  font-size: 10px;
  font-weight: 700;
  color: var(--blue);
  margin-right: 5px;
  font-family: "DM Mono", monospace;
}

/* ボタン */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--text);
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  width: 100%;
  transition: opacity 0.15s;
}

.btn:hover { opacity: 0.85; }

.gtime {
  font-size: 11px;
  color: var(--hint);
  text-align: center;
  margin-top: 6px;
}

/* スマホ */
@media (max-width: 768px) {
  .grid3 { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .tabs { display: flex; }
  .panel { display: none; }
  .panel.active { display: block; }
  .header { flex-wrap: wrap; gap: 10px; }
  .cotg { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">
      <div class="logo-mark">FX</div>
      <div>
        <div class="logo-text">FX Terminal</div>
        <div class="logo-sub">Fundamental Analysis</div>
      </div>
    </div>
    <div class="header-right">
      <div class="ts"><span class="live-dot"></span><span id="clk"></span></div>
      <div class="status-badge" id="status" style="background:var(--bg);color:var(--muted);">読込中...</div>
    </div>
  </div>

  <div class="warn">
    ⚠️ 自動分析レポートです。最終判断は必ずご自身で。
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="showTab(0)">強弱</button>
    <button class="tab" onclick="showTab(1)">ペア</button>
    <button class="tab" onclick="showTab(2)">ニュース</button>
    <button class="tab" onclick="showTab(3)">COT</button>
    <button class="tab" onclick="showTab(4)">根拠</button>
  </div>

  <div class="grid3">
    <div class="panel active" id="p0">
      <div class="panel-title">通貨強弱スコア</div>
      <div id="clist"></div>
    </div>
    <div class="panel active" id="p1">
      <div class="panel-title">ペア方向性</div>
      <div id="plist"></div>
    </div>
    <div class="panel active" id="p2" style="grid-row: span 2;">
      <div class="panel-title">FX関連ニュース</div>
      <div class="nlist" id="nlist"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel active" id="p3">
      <div class="panel-title">COT 機関投資家</div>
      <div class="cotg" id="cotg"></div>
    </div>
    <div class="panel active" id="p4">
      <div class="panel-title">スコア根拠</div>
      <div class="rlist" id="rlist"></div>
      <button class="btn" onclick="fetchLatestData()">↻ 今すぐ更新</button>
      <div class="gtime">開くと自動更新 / 30分ごと自動</div>
    </div>
  </div>

</div>

<script>
let DATA = {"timestamp":"2026-05-08T01:35:40.121479","generated":"2026年05月08日 01:35","scores":{"USD":-1,"JPY":0,"EUR":0,"GBP":0,"AUD":0,"NZD":0,"CAD":0,"CHF":0},"pairs":[{"pair":"USDJPY","direction":"様子見","diff":-1,"base_score":-1,"quote_score":0},{"pair":"EURUSD","direction":"様子見","diff":1,"base_score":0,"quote_score":-1},{"pair":"GBPUSD","direction":"様子見","diff":1,"base_score":0,"quote_score":-1},{"pair":"AUDUSD","direction":"様子見","diff":1,"base_score":0,"quote_score":-1},{"pair":"EURJPY","direction":"様子見","diff":0,"base_score":0,"quote_score":0},{"pair":"GBPJPY","direction":"様子見","diff":0,"base_score":0,"quote_score":0}],"news":[{"source":"Fed","title":"Federal Reserve issues FOMC statement","summary":""},{"source":"FXStreet","title":"EUR/USD: Sentiment-led rally eyes 1.1825","summary":""},{"source":"FXStreet","title":"USD/JPY muted as easing Middle East tensions weigh on US Dollar","summary":""},{"source":"FXStreet","title":"Gold extends rally as traders reassess Fed outlook","summary":""},{"source":"Investing","title":"Bitcoin pulls back as markets eye Iran progress","summary":""}],"cot":{},"reasons":{"USD":["[弱気] Fed: Higher-for-longer stance weighs on Gold – TD Secur"]}};

function showTab(n) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
  if (window.innerWidth <= 768) {
    for (let i=0; i<5; i++) document.getElementById('p'+i).classList.toggle('active', i===n);
  }
}

function renderAll(d) {
  const sorted = Object.entries(d.scores).sort((a,b) => b[1]-a[1]);
  const maxAbs = Math.max(...Object.values(d.scores).map(Math.abs), 1);

  document.getElementById('clist').innerHTML = sorted.map(([c,s]) => {
    const cls = s>0 ? 'pos' : s<0 ? 'neg' : 'neu';
    const pct = s===0 ? 0 : Math.abs(s)/maxAbs*100;
    const sign = s>0 ? '+' : '';
    return `<div class="crow">
      <div class="cname">${c}</div>
      <div class="btrack"><div class="bfill ${cls}" style="width:${pct}%"></div></div>
      <div class="score-badge ${cls}">${sign}${s}</div>
    </div>`;
  }).join('');

  document.getElementById('plist').innerHTML = d.pairs.map(p => {
    let cls='n', label='様子見';
    if (p.direction.includes('強くロング')) { cls='sl'; label='強くロング'; }
    else if (p.direction.includes('ロング')) { cls='l'; label='ロング優勢'; }
    else if (p.direction.includes('強くショート')) { cls='ss'; label='強くショート'; }
    else if (p.direction.includes('ショート')) { cls='s'; label='ショート優勢'; }
    const sign = p.diff>0?'+':'';
    return `<div class="prow">
      <div class="pname">${p.pair}</div>
      <div class="dir-badge ${cls}">${label}</div>
      <div class="diff-num">${sign}${p.diff}</div>
    </div>`;
  }).join('');

  document.getElementById('nlist').innerHTML = (d.news||[]).map(n =>
    `<div class="nitem"><div class="nsrc">${n.source}</div><div class="ntitle">${n.title}</div></div>`
  ).join('') || '<div class="ritem">取得中...</div>';

  const ce = Object.entries(d.cot||{});
  document.getElementById('cotg').innerHTML = ce.length ? ce.map(([c,v]) =>
    `<div class="coti">
      <div class="cotc" style="color:${v.net>0?'var(--green)':'var(--red)'}">${c}</div>
      <div class="cotb" style="color:${v.net>0?'var(--green)':'var(--red)'}">${v.net>0?'▲ LONG':'▼ SHORT'}</div>
      <div class="cotn">${v.net>0?'+':''}${v.net.toLocaleString()}</div>
    </div>`
  ).join('') : '<div class="ritem" style="grid-column:span 3;text-align:center;padding:16px;color:var(--muted)">取得中...</div>';

  const items = [];
  for (const [c,list] of Object.entries(d.reasons||{}))
    for (const r of list) items.push(`<div class="ritem"><span class="rcur">${c}</span>${r}</div>`);
  document.getElementById('rlist').innerHTML = items.join('') || '<div class="ritem">データなし</div>';
}

async function fetchLatestData() {
  const s = document.getElementById('status');
  s.textContent = '更新中...';
  s.style.background = 'var(--yellow-bg)';
  s.style.color = 'var(--yellow-text)';
  try {
    const r = await fetch('fx_data.json?t='+Date.now());
    const d = await r.json();
    renderAll(d);
    s.textContent = '✓ '+d.generated;
    s.style.background = 'var(--green-bg)';
    s.style.color = 'var(--green-text)';
  } catch(e) {
    renderAll(DATA);
    s.textContent = '保存データ表示中';
    s.style.background = 'var(--bg)';
    s.style.color = 'var(--muted)';
  }
}

setInterval(() => {
  document.getElementById('clk').textContent = new Date().toLocaleString('ja-JP');
}, 1000);

window.addEventListener('load', fetchLatestData);
setInterval(fetchLatestData, 30*60*1000);
</script>
</body>
</html>
