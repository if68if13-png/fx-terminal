name: Daily FX Analysis

on:
  schedule:
    - cron: '0 21 * * *'  # 日本時間 毎朝6時（UTC 21時）
  workflow_dispatch:        # 手動実行ボタンも追加

permissions:
  contents: write

jobs:
  run-fx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run FX analysis
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 fx_fundamental.py

      - name: Commit and push results
        run: |
          git config user.name "fx-bot"
          git config user.email "bot@fx-terminal"
          git add fx_data.json
          git diff --staged --quiet || git commit -m "auto: 毎朝の自動分析 $(date '+%Y/%m/%d %H:%M')"
          git push
